<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Traffic Light Identifier</title>
		<style>
			body {
				font-family: Arial, sans-serif;
				margin: 0;
				padding: 20px;
				background-color: #f0f0f0;
			}
			.container {
				max-width: 1200px;
				margin: 0 auto;
				display: flex;
				flex-direction: column;
				gap: 20px;
			}
			.video-container {
				position: relative;
				width: 100%;
				max-width: 640px;
				margin: 0 auto;
			}
			video {
				width: 100%;
				display: block;
			}
			canvas {
				position: absolute;
				top: 0;
				left: 0;
			}
			.info-panel {
				background-color: white;
				padding: 15px;
				border-radius: 5px;
				box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
			}
			.status {
				font-weight: bold;
				margin-bottom: 10px;
			}
			.timestamp-display {
				font-size: 24px;
				color: #00ff00;
				font-weight: bold;
				text-align: center;
				padding: 10px;
				background-color: #f5f5f5;
				border-radius: 5px;
				margin-top: 10px;
				display: none;
			}
			.controls {
				display: flex;
				gap: 10px;
				justify-content: center;
			}
			button {
				padding: 10px 20px;
				font-size: 16px;
				background-color: #4caf50;
				color: white;
				border: none;
				border-radius: 5px;
				cursor: pointer;
			}
			button:hover {
				background-color: #45a049;
			}
			.instructions {
				font-size: 14px;
				color: #666;
				margin-top: 10px;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<h1 style="text-align: center">Traffic Light Identifier</h1>

			<div class="video-container">
				<video id="video" autoplay playsinline></video>
				<canvas id="canvas"></canvas>
			</div>

			<div class="info-panel">
				<div class="status" id="status">Status: Initializing...</div>
				<div class="timestamp-display" id="timestampDisplay"></div>
				<div class="controls">
					<button id="startBtn">Start Camera</button>
					<button id="stopBtn" disabled>Stop Camera</button>
				</div>
				<div class="instructions">Click "Start Camera" to begin. The system will detect traffic lights and draw boxes around them. When a green light is detected, the current timestamp will be displayed.</div>
			</div>
		</div>

		<script>
			const video = document.getElementById("video");
			const canvas = document.getElementById("canvas");
			const ctx = canvas.getContext("2d");
			const startBtn = document.getElementById("startBtn");
			const stopBtn = document.getElementById("stopBtn");
			const statusDiv = document.getElementById("status");
			const timestampDisplay = document.getElementById("timestampDisplay");

			let stream = null;
			let isRunning = false;
			let animationFrame = null;

			// Traffic light color ranges (R, G, B)
			const trafficLightColors = {
				red: { r: [100, 255], g: [0, 50], b: [0, 50] },
				yellow: { r: [100, 255], g: [100, 200], b: [0, 50] },
				green: { r: [0, 50], g: [100, 255], b: [0, 50] },
			};

			// Function to get current timestamp
			function getCurrentTimestamp() {
				const now = new Date();
				return now.toISOString().split("T")[1].split(".")[0];
			}

			// Function to update timestamp display
			function showTimestamp() {
				timestampDisplay.textContent = "GREEN LIGHT DETECTED: " + getCurrentTimestamp();
				timestampDisplay.style.display = "block";
				setTimeout(() => {
					timestampDisplay.style.display = "none";
				}, 2000);
			}

			// Function to detect color in region
			function detectColor(region, colors) {
				let detectedColor = null;
				let maxConfidence = 0;

				for (const [colorName, colorRange] of Object.entries(colors)) {
					let totalDistance = 0;
					let validPixels = 0;

					for (const pixel of region) {
						const { r, g, b } = pixel;
						const distance = Math.max(0, r - colorRange.r[1]) + Math.max(0, colorRange.r[0] - r) + Math.max(0, g - colorRange.g[1]) + Math.max(0, colorRange.g[0] - g) + Math.max(0, b - colorRange.b[1]) + Math.max(0, colorRange.b[0] - b);

						totalDistance += distance;
						validPixels++;
					}

					const averageDistance = totalDistance / validPixels;
					const confidence = Math.max(0, 1 - averageDistance / 255);

					if (confidence > maxConfidence) {
						maxConfidence = confidence;
						detectedColor = colorName;
					}
				}

				return { detectedColor, confidence };
			}

			// Function to process video frame
			function processFrame() {
				if (!isRunning) return;

				// Set canvas size to match video
				canvas.width = video.videoWidth;
				canvas.height = video.videoHeight;

				// Draw video frame to canvas
				ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

				// Get frame data for analysis
				const frameData = ctx.getImageData(0, 0, canvas.width, canvas.height);
				const data = frameData.data;

				// Detect potential traffic light regions
				const trafficLightRegions = findTrafficLightRegions(data, canvas.width, canvas.height);

				// Process each detected region
				for (const region of trafficLightRegions) {
					const colorDetection = detectColor(region.pixels, trafficLightColors);

					// Draw bounding box
					ctx.strokeStyle = "lime";
					ctx.lineWidth = 3;
					ctx.strokeRect(region.x, region.y, region.width, region.height);

					// Add background to box
					ctx.fillStyle = "rgba(0, 255, 0, 0.2)";
					ctx.fillRect(region.x, region.y, region.width, region.height);

					// Add label
					ctx.fillStyle = "white";
					ctx.font = "16px Arial";
					const label = `Traffic Light: ${colorDetection.detectedColor}`;
					const labelWidth = ctx.measureText(label).width;
					ctx.fillRect(region.x, region.y - 25, labelWidth + 10, 25);
					ctx.fillStyle = "black";
					ctx.fillText(label, region.x + 5, region.y - 8);

					// Check for green light
					if (colorDetection.detectedColor === "green" && colorDetection.confidence > 0.6) {
						showTimestamp();
					}
				}

				// Continue processing
				animationFrame = requestAnimationFrame(processFrame);
			}

			// Function to find traffic light regions
			function findTrafficLightRegions(data, width, height) {
				const regions = [];
				const blockSize = 40; // Size of blocks to analyze
				const minRegionSize = 30; // Minimum size for valid region

				// Skip top part of frame (assuming traffic lights are in upper portion)
				const skipTop = Math.floor(height * 0.3);

				for (let y = skipTop; y < height - blockSize; y += blockSize) {
					for (let x = 0; x < width - blockSize; x += blockSize) {
						const pixels = [];
						let totalR = 0,
							totalG = 0,
							totalB = 0;

						// Collect pixels in block
						for (let py = 0; py < blockSize; py++) {
							for (let px = 0; px < blockSize; px++) {
								const idx = ((y + py) * width + (x + px)) * 4;
								const r = data[idx];
								const g = data[idx + 1];
								const b = data[idx + 2];

								pixels.push({ r, g, b });
								totalR += r;
								totalG += g;
								totalB += b;
							}
						}

						// Calculate average color
						const avgR = totalR / pixels.length;
						const avgG = totalG / pixels.length;
						const avgB = totalB / pixels.length;

						// Check if block could be a traffic light (needs red or yellow dominance)
						const isRedDominated = avgR > avgG * 1.5 && avgR > avgB * 1.5;
						const isYellowDominated = avgR > avgG * 1.5 && avgB > avgG * 1.5;

						if (isRedDominated || isYellowDominated) {
							// Collect more detailed pixels for color detection
							const detailedPixels = [];
							for (let py = 0; py < blockSize * 2; py++) {
								for (let px = 0; px < blockSize * 2; px++) {
									const idx = ((y + py * 2) * width + (x + px * 2)) * 4;
									detailedPixels.push({
										r: data[idx],
										g: data[idx + 1],
										b: data[idx + 2],
									});
								}
							}

							regions.push({
								x: x,
								y: y,
								width: blockSize * 2,
								height: blockSize * 2,
								pixels: detailedPixels,
							});
						}
					}
				}

				return regions;
			}

			// Start camera
			async function startCamera() {
				try {
					statusDiv.textContent = "Status: Starting camera...";

					stream = await navigator.mediaDevices.getUserMedia({
						video: {
							facingMode: "environment",
							width: { ideal: 640 },
							height: { ideal: 480 },
						},
					});

					video.srcObject = stream;

					await new Promise((resolve) => {
						video.onloadedmetadata = () => {
							resolve();
						};
					});

					video.play();
					isRunning = true;
					statusDiv.textContent = "Status: Running - Scanning for traffic lights...";
					startBtn.disabled = true;
					stopBtn.disabled = false;
					processFrame();
				} catch (error) {
					console.error("Error accessing camera:", error);
					statusDiv.textContent = "Status: Error accessing camera. Please check permissions.";
				}
			}

			// Stop camera
			function stopCamera() {
				isRunning = false;
				if (animationFrame) {
					cancelAnimationFrame(animationFrame);
				}

				if (stream) {
					stream.getTracks().forEach((track) => track.stop());
					stream = null;
				}

				statusDiv.textContent = "Status: Camera stopped";
				startBtn.disabled = false;
				stopBtn.disabled = true;
				timestampDisplay.style.display = "none";
			}

			// Event listeners
			startBtn.addEventListener("click", startCamera);
			stopBtn.addEventListener("click", stopCamera);
		</script>
	</body>
</html>
